services: # 隔离测试：make validation-up；make validation-status 查询随机 HTTPS 端口。
  caddy:
    # environment: # 可选：启用 TEST_TLS 时同时取消本行及下一行注释。
    #   TEST_TLS: ${TEST_TLS:-false} # 用 TEST_TLS=true make validation-up 启用内部测试 CA；内置模式仍禁止校验/发布。
    ports: !override # 仅宿主回环可达，不使用真实部署的 80/443。
      - '127.0.0.1::80' # 随机 HTTP 端口。
      - '127.0.0.1::443' # 随机 HTTPS 端口：打开 https://127.0.0.1:查询到的端口/setup。
      # - '127.0.0.1::443/udp' # 可选：隔离环境的 HTTP/3 随机端口。
    volumes: !override # 独立测试卷，不读取真实 .run；make validation-down 会删除这些卷。
      - validation_manager:/var/lib/manager
      - validation_snapshots:/srv/snapshots
      - validation_data:/data
      - validation_config:/config
      # - validation_socket:/run/caddy # 可选：需同时启用下方 validation_socket 卷声明，仅查看运行时 Socket。
volumes:
  validation_manager:
  validation_snapshots:
  validation_data:
  validation_config:
  # validation_socket: # 可选：与上方 Socket 挂载同时取消注释，不属于备份数据。
