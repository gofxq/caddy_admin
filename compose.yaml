name: caddy-admin # 可选：固定项目名；不设置时使用目录名。
services: # 内置模式：docker compose up -d，然后打开 http://服务器IP/setup。
  caddy:
    image: ghcr.io/gofxq/caddy-admin:latest # 必需：拉取预构建镜像，无需源码；固定版本可改为 sha-提交SHA 标签。
    restart: unless-stopped # 异常退出自动重启，手动停止后保持停止。
    init: true # 回收子进程并转发停止信号。
    stop_grace_period: 20s # 给 Manager/Caddy 正常停止留出时间。
    healthcheck:
      test: [CMD, manager, health] # 检查 Manager、SQLite 和 Caddy 就绪状态。
      timeout: 5s
      start_period: 20s
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-} # 可选：仅首次初始化使用；手动 Setup 确认使用；完整预配置可自动初始化，不回显。
      DNS_PROVIDER: ${DNS_PROVIDER:-cloudflare} # 可选：首次初始化默认 cloudflare，也可选 dnspod；初始化后使用已保存的提供商。
      DNSPOD_TOKEN: ${DNSPOD_TOKEN:-} # 可选：DNSPod 的 ID,Token，非腾讯云 SecretId/SecretKey。
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-} # 可选：首次初始化后自动保存，初始化后运行文件优先。
      SETUP_DOMAIN: ${SETUP_DOMAIN:-} # 可选：首个基础域名，例如 example.com 或 *.example.com。
      SETUP_CADDY_IP: ${SETUP_CADDY_IP:-} # 自动初始化必填：客户端实际访问 Caddy 的 IPv4/IPv6；不推断，不接受 0.0.0.0 或 ::。
      SETUP_ADMIN_USERNAME: ${SETUP_ADMIN_USERNAME:-admin} # 可选：首次管理员用户名。
      SETUP_RESOLVERS: ${SETUP_RESOLVERS:-1.1.1.1} # 可选：逗号分隔的服务器 DNS IP 或 IP:端口。
    ports: # 宿主绑定直接修改下方映射；宿主防火墙决定实际可达范围。
      - '80:80' # 初始化前提供HTTP Setup（手动凭据会明文传输），完成后跳转 HTTPS；默认绑定宿主所有接口。
      - '443:443' # HTTPS 初始化、控制台及业务入口；改宿主端口后须显式访问该端口。
      - '443:443/udp' # 可选：HTTP/3；不启用时仍可通过 TCP HTTPS 访问。
    cap_drop: [ALL] # 移除默认 capabilities，再仅授予启动所需权限。
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, DAC_OVERRIDE, CHOWN, FOWNER] # 绑定低端口、准备目录权限并切换到 10001:10001。
    security_opt: [no-new-privileges:true] # 禁止进程获得新增权限；不要使用 privileged 或挂载 Docker Socket。
    volumes: # 可选：在 .env 设置 RUN_DIR 自定义宿主数据根目录，默认 ./.run；自动创建目录；四个持久化目录须停服一致备份，包含私钥的备份必须加密。
      - '${RUN_DIR:-./.run}/manager:/var/lib/manager' # SQLite、会话、实例锁和受限 secret。
      - '${RUN_DIR:-./.run}/snapshots:/srv/snapshots' # active.json 启动快照，不作为手工配置入口。
      - '${RUN_DIR:-./.run}/caddy-data:/data' # 证书、私钥和 ACME 状态。
      - '${RUN_DIR:-./.run}/caddy-config:/config' # Caddy 配置目录。
      # - '${RUN_DIR:-./.run}/caddy-socket:/run/caddy' # 可选：查看运行时 Socket；单容器内无需挂载，不属于备份数据。
networks:
  default:
    name: caddy-admin # 可选：固定网络名；不设置时使用目录名。
    external: true