services: # 外部模式：docker compose -f compose.yaml -f compose.external.yaml up -d。
  caddy: # 仅运行 Manager，80/443 由专用外部 Caddy 提供；外部不可达时不会回退到内置实例。
    environment:
      CADDY_ADMIN_URL: ${CADDY_ADMIN_URL:?请设置外部 Caddy Admin API 地址} # 必填：带端口的 HTTP(S) Origin，不含路径或凭据；HTTPS 验证信任链。
      MANAGER_DIAL: ${MANAGER_DIAL:?请设置外部 Caddy 可达的 Manager 地址} # 必填：外部 Caddy 的反代目标 host:port；经宿主映射时使用发布端口。
      # CADDY_PROBE_ADDRESS: ${CADDY_PROBE_ADDRESS:-} # 可选：TLS 探测目标 host:port；默认 Admin API 主机名加 443，地址不同时取消注释并设置。
      # LISTEN: ${LISTEN:-:8080} # 可选：容器内 Manager 监听，默认 :8080；改端口须同步 Manager 映射与 MANAGER_DIAL。
    ports: !override # 替换内置模式 80/443 映射，不能同时保留。
      - '${SETUP_BIND:-0.0.0.0:8082}:8082' # HTTPS 初始化/交接入口；默认固定宿主端口 8082，应用不默认限制来源；宿主防火墙决定可达范围。
      - '${MANAGER_BIND:-127.0.0.1:8081}:8080' # Manager 默认仅宿主回环可达；远端 Caddy 按需绑定可信接口并限制来源。
    # extra_hosts: # 可选：外部 Caddy 在宿主机上且使用 host.docker.internal 时，取消下行及此行注释。
    #   - 'host.docker.internal:host-gateway' # 为容器增加宿主网关地址，不自动发现宿主 LAN IP。
